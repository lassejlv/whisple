name: Build Windows release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Exact source commit to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Source ref to verify without publishing
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          # bindgen needs libclang for the whisper.cpp bindings. The runner
          # image ships LLVM; point bindgen at it.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Build whisper.cpp for a fixed x86-64 baseline (AVX2, FMA and F16C,
          # every x86 CPU since about 2013) instead of the runner's own CPU,
          # which may have instructions users' PCs lack.
          $toolchain = Join-Path $env:RUNNER_TEMP 'ggml-portable.cmake'
          @(
            'set(GGML_NATIVE OFF CACHE BOOL "Portable Windows build" FORCE)'
            'set(GGML_AVX ON CACHE BOOL "" FORCE)'
            'set(GGML_AVX2 ON CACHE BOOL "" FORCE)'
            'set(GGML_FMA ON CACHE BOOL "" FORCE)'
            'set(GGML_F16C ON CACHE BOOL "" FORCE)'
          ) | Out-File -FilePath $toolchain -Encoding ascii
          "CMAKE_TOOLCHAIN_FILE=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }

      - name: Run Rust tests
        run: cargo test --locked --features licensing

      - name: Test updater replacement and rollback
        shell: pwsh
        run: ./scripts/windows/test-apply-update.ps1

      - name: Build installers and updater archive
        shell: pwsh
        run: ./scripts/windows/package-windows.ps1 -WithLicensing

      - name: Verify archives and test both installers
        shell: pwsh
        run: ./scripts/windows/verify-release.ps1 -TestInstallers

      - name: Validate real archive with the app updater
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $env:WHISPLE_TEST_UPDATE_ARCHIVE = "$PWD\target\dist\Whisple-$version-windows-x86_64.zip"
          $env:WHISPLE_TEST_CURRENT_INSTALL = "$PWD\target\release\whisple.exe"
          cargo test --locked --features licensing updater::tests::release_archive_passes_updater_validation -- --ignored --exact

      - name: Save verified binaries
        uses: actions/upload-artifact@v4
        with:
          name: Whisple-windows-x86_64
          path: |
            target/dist/*-setup.exe
            target/dist/*.msi
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Save installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Whisple-windows-installer-logs
          path: target/windows-smoke-logs/
          if-no-files-found: ignore
          retention-days: 7
