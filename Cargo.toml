[package]
name = "whisp"
version = "0.1.0"
edition = "2021"
description = "Local-first voice dictation"
license = "MIT"
publish = false

[dependencies]
cpal = "0.15"
dirs = "6"
gpui = "0.2.2"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.14"
x11rb = { version = "0.13", features = ["shape"] }
