[package]
name = "whisple"
version = "0.2.0"
edition = "2021"
description = "Local-first voice dictation"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
cpal = "0.15"
dirs = "6"
gpui-kit = { version = "0.6", default-features = false, features = ["component", "assets"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
tempfile = "3"
whisper-rs = "0.14"
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"
global-hotkey = "0.8"
tray-icon = { version = "0.24", default-features = false }
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-macros]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3

[profile.dev.package.gpui-kit-assets]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
